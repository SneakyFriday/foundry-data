image: alpine:latest

variables:
  PROJECT_SLUG: "foundryvtt-lang-de"
  PACKAGE_ARCHIVE_NAME: "${PROJECT_SLUG}-${CI_COMMIT_TAG}.zip"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PROJECT_SLUG}/${CI_COMMIT_TAG}"

stages:
  - validate
  - package
  - release

versioncheck:
  stage: validate
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk update
    - apk add git
  script:
    - 'tmpmodule=$(cat module.json | sed -r -e "s|\"version\": \"[0-9\.]+\"|\"version\": \"${CI_COMMIT_TAG}\"|g")'
    - echo "$tmpmodule" > module.json
    - git diff --exit-code

package:
  stage: package
  needs:
    - versioncheck
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk update
    - apk add zip curl
  script:
    - tmp2module=$(cat module.json | sed -e "s|raw/${CI_DEFAULT_BRANCH}/module.json|releases/${CI_COMMIT_TAG}/downloads/module.json|g"
      | sed -e "s|archive/${CI_DEFAULT_BRANCH}/${PROJECT_SLUG}-${CI_DEFAULT_BRANCH}\.zip|releases/${CI_COMMIT_TAG}/downloads/${PACKAGE_ARCHIVE_NAME}|g")
    - echo "$tmp2module" > module.json
    - 'zip -qr "${PACKAGE_ARCHIVE_NAME}" translations/de/ module.json LICENSE.txt'
    - 'curl -H "Job-Token: ${CI_JOB_TOKEN}" -T "${PACKAGE_ARCHIVE_NAME}" "${PACKAGE_REGISTRY_URL}/${PACKAGE_ARCHIVE_NAME}"'
    - 'curl -H "Job-Token: ${CI_JOB_TOKEN}" -T "module.json" "${PACKAGE_REGISTRY_URL}/module.json"'
  artifacts:
    paths:
      - '${PACKAGE_ARCHIVE_NAME}'
      - 'module.json'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo 'release'
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: '$CI_COMMIT_DESCRIPTION'
    assets:
      links:
        - name: '${PACKAGE_ARCHIVE_NAME}'
          link_type: package
          url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_ARCHIVE_NAME}'
          filepath: '/${PACKAGE_ARCHIVE_NAME}'
        - name: 'module.json'
          link_type: other
          url: '${PACKAGE_REGISTRY_URL}/module.json'
          filepath: '/module.json'

